<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematik Arenası | Konu Seçmeli</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.8);
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --correct: #00ff88;
            --wrong: #ff3366;
            --text-main: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(255, 0, 234, 0.1) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Üst Skor Paneli */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            font-weight: 800;
            font-size: 1.2rem;
            display: none; /* Oyun başlayınca görünecek */
        }

        .score-box { color: var(--neon-blue); }
        .score-correct { color: var(--correct); }
        .score-wrong { color: var(--wrong); }

        /* Ana İçerik */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Başlangıç ve Konu Seçme Ekranı */
        .start-screen {
            text-align: center;
            animation: zoomIn 0.5s ease-out;
            width: 100%;
        }
        
        .start-screen h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .start-screen p {
            margin-bottom: 30px;
            color: #aaa;
            font-size: 1.1rem;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .topic-btn {
            background: transparent;
            color: white;
            border: 2px solid rgba(255,255,255,0.2);
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topic-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--neon-blue);
            transform: translateY(-3px);
        }

        .topic-btn span {
            font-size: 0.9rem;
            color: #888;
        }

        /* Sınav Ekranı */
        .quiz-screen {
            width: 100%;
            display: none;
        }

        .question-card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            animation: slideInRight 0.4s ease-out;
        }

        .question-text {
            font-size: 1.3rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-container { grid-template-columns: 1fr; }
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #666;
        }

        .option-btn.correct {
            background: rgba(0, 255, 136, 0.2);
            border-color: var(--correct);
            color: var(--correct);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        .option-btn.wrong {
            background: rgba(255, 51, 102, 0.2);
            border-color: var(--wrong);
            color: var(--wrong);
            animation: shake 0.4s;
        }

        /* Animasyonlar */
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes slideInRight {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <!-- Skor Tablosu -->
    <div class="scoreboard" id="scoreboard">
        <div class="score-box">SORU: <span id="question-counter">1/5</span></div>
        <div class="score-correct">DOĞRU: <span id="score-correct">0</span></div>
        <div class="score-wrong">YANLIŞ: <span id="score-wrong">0</span></div>
    </div>

    <div class="main-container">
        
        <!-- Başlangıç ve Konu Seçme Ekranı -->
        <div class="start-screen" id="start-screen">
            <h1>Matematik Arenası</h1>
            <p>Hangi konudan meydan okumak istersin?</p>
            
            <div class="topic-grid">
                <button class="topic-btn" onclick="startQuiz('sayilar')">
                    <div>🔢 Sayılar ve Nicelikler</div>
                    <span>Çarpanlar, Asallar</span>
                </button>
                <button class="topic-btn" onclick="startQuiz('kesirler')">
                    <div>📏 Kesirler ve Ondalık</div>
                    <span>Bölme, Uzunluk</span>
                </button>
                <button class="topic-btn" onclick="startQuiz('olasilik')">
                    <div>🎲 Veriden Olasılığa</div>
                    <span>Deneysel Olasılık</span>
                </button>
            </div>
        </div>

        <!-- Sınav Ekranı -->
        <div class="quiz-screen" id="quiz-screen">
            <div class="question-card" id="question-card">
                <div class="question-text" id="question-text">Soru yükleniyor...</div>
                <div class="options-container" id="options-container">
                    <!-- Seçenekler buraya gelecek -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- SES MOTORU ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'click') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        // --- SORU BANKASI (Konulara Göre Ayrıldı) ---
        const questionBank = {
            'sayilar': [
                { q: "12 sayısının asal çarpanları hangileridir?", c: "2 ve 3", w: ["1, 2, 3, 4, 6, 12", "2, 3 ve 4", "Sadece 2"] },
                { q: "20 sayısının kaç tane çarpanı vardır?", c: "6", w: ["4", "5", "8"] },
                { q: "Aşağıdakilerden hangisi bir asal sayıdır?", c: "17", w: ["15", "21", "27"] },
                { q: "Hem 3'e hem de 5'e tam bölünebilen en küçük doğal sayı kaçtır?", c: "15", w: ["8", "30", "45"] },
                { q: "Aşağıdaki sayılardan hangisi 2 ile kalansız bölünemez?", c: "39", w: ["12", "46", "80"] }
            ],
            'kesirler': [
                { q: "3/5 kesrinin ondalık gösterimi nedir?", c: "0,6", w: ["0,35", "0,53", "1,66"] },
                { q: "1 hektometre (hm) kaç metredir?", c: "100 m", w: ["10 m", "1000 m", "0,1 m"] },
                { q: "1/4 kesrinin yüzde (%) olarak karşılığı nedir?", c: "%25", w: ["%14", "%40", "%75"] },
                { q: "2,5 sayısı aşağıdaki kesirlerden hangisine eşittir?", c: "5/2", w: ["2/5", "1/2", "5/4"] },
                { q: "5 dm kaç cm'dir?", c: "50 cm", w: ["5 cm", "500 cm", "0,5 cm"] }
            ],
            'olasilik': [
                { q: "Bir zar atıldığında üst yüze çift sayı gelme olasılığı kaçtır?", c: "1/2", w: ["1/3", "1/6", "2/3"] },
                { q: "Torbada 3 kırmızı, 4 mavi top var. Mavi çekme olasılığı kaçtır?", c: "4/7", w: ["3/7", "1/2", "4/12"] },
                { q: "Hilesiz bir madeni para atıldığında 'Tura' gelme olasılığı kaçtır?", c: "1/2", w: ["1/4", "1", "0"] },
                { q: "Bir zar atıldığında 7 gelme olasılığı kaçtır?", c: "0", w: ["1/6", "1/7", "1/2"] },
                { q: "İçinde sadece 5 tane kırmızı top olan torbadan kırmızı çekme olasılığı kaçtır?", c: "1 (Kesin)", w: ["0", "1/5", "5/5 (0)"] }
            ]
        };

        let currentQuestion = 0;
        let correctScore = 0;
        let wrongScore = 0;
        let canAnswer = true;
        let selectedQuestions = []; // Karıştırılmış sorular burada tutulacak

        // --- DİZİYİ KARIŞTIRMA (FISHER-YATES) ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- OYUNU BAŞLAT ---
        function startQuiz(topic) {
            playSound('click');
            
            // Oyun ekranını hazırla
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('scoreboard').style.display = 'flex';
            document.getElementById('quiz-screen').style.display = 'block';
            
            currentQuestion = 0;
            correctScore = 0;
            wrongScore = 0;
            updateScoreboard();

            // Seçilen konudan soruları al ve karıştır
            let rawQuestions = questionBank[topic];
            selectedQuestions = shuffleArray([...rawQuestions]); // Kopyasını alıp karıştır

            showQuestion();
        }

        // --- SORUYU GÖSTER ---
        function showQuestion() {
            canAnswer = true;
            const qData = selectedQuestions[currentQuestion];
            
            // Soru metnini güncelle
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('question-counter').innerText = `${currentQuestion + 1}/${selectedQuestions.length}`;

            // Seçenekleri hazırla (Doğru şık + Yanlış şıklar)
            let allOptions = [qData.c, ...qData.w]; // Doğru cevabı ve yanlışları birleştir
            
            // Şıkları rastgele karıştır
            allOptions = shuffleArray(allOptions);

            // Doğru cevabın yeni yerini bul
            const newCorrectIndex = allOptions.indexOf(qData.c);
            qData.currentCorrectIndex = newCorrectIndex; // Doğru cevabı objeye kaydet

            // Seçenek butonlarını oluştur
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; 

            allOptions.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${String.fromCharCode(65 + index)}) ${option}`; // A, B, C, D
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        // --- CEVABI KONTROL ET ---
        function checkAnswer(selectedIndex, btnElement) {
            if (!canAnswer) return; 
            canAnswer = false;

            const correctIndex = selectedQuestions[currentQuestion].currentCorrectIndex;
            const allButtons = document.querySelectorAll('.option-btn');

            if (selectedIndex === correctIndex) {
                playSound('correct');
                btnElement.classList.add('correct');
                correctScore++;
            } else {
                playSound('wrong');
                btnElement.classList.add('wrong');
                allButtons[correctIndex].classList.add('correct'); // Doğruyu göster
                wrongScore++;
            }

            updateScoreboard();

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < selectedQuestions.length) {
                    showQuestion();
                } else {
                    endQuiz();
                }
            }, 1500);
        }

        function updateScoreboard() {
            document.getElementById('score-correct').innerText = correctScore;
            document.getElementById('score-wrong').innerText = wrongScore;
        }

        function endQuiz() {
            const quizScreen = document.getElementById('quiz-screen');
            quizScreen.innerHTML = `
                <div class="question-card" style="text-align: center;">
                    <h2 style="color: var(--neon-blue); font-size: 2rem; margin-bottom: 20px;">Meydan Okuma Tamamlandı!</h2>
                    <p style="font-size: 1.2rem; margin-bottom: 20px;">Doğru Sayın: <span style="color: var(--correct); font-weight: bold; font-size: 1.5rem;">${correctScore}</span></p>
                    <p style="font-size: 1.2rem; margin-bottom: 30px;">Yanlış Sayın: <span style="color: var(--wrong); font-weight: bold; font-size: 1.5rem;">${wrongScore}</span></p>
                    <button class="start-btn" onclick="location.reload()" style="background: var(--neon-blue); color: black; border: none; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1.1rem;">ANA MENÜYE DÖN</button>
                </div>
            `;
        }
    </script>
</body>
</html>
