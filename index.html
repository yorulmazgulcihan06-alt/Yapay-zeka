<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matematik Arenası</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--p:#1e293b;--nb:#00f3ff;--np:#ff00ea;--c:#00ff88;--w:#ff3366;--p1:#38bdf8;--p2:#f472b6}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Montserrat',sans-serif}
body{background:var(--bg);color:#fff;background-image:radial-gradient(circle at 10% 20%,rgba(0,243,255,.1),transparent 40%),radial-gradient(circle at 90% 80%,rgba(255,0,234,.1),transparent 40%);min-height:100vh;display:flex;flex-direction:column}
#intro{position:fixed;inset:0;background:#000;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s}
.i-t{font-size:2.5rem;font-weight:800;text-shadow:0 0 10px #fff,0 0 20px var(--nb);opacity:0;transform:scale(.8);transition:all 1s;text-align:center}
.i-t.sh{opacity:1;transform:scale(1)}
.i-s{color:var(--nb);margin-top:10px;opacity:0;transition:opacity 1s;text-align:center}
.i-s.sh{opacity:1}
.i-b{margin-top:40px;padding:15px 30px;color:var(--nb);background:none;border:2px solid var(--nb);border-radius:5px;cursor:pointer;font-weight:800;text-transform:uppercase}
.snd{position:fixed;top:15px;right:15px;background:rgba(0,0,0,.5);color:#fff;border:1px solid #555;padding:8px;border-radius:50%;cursor:pointer;z-index:10}
#score{display:none;justify-content:space-between;background:rgba(0,0,0,.8);padding:10px;border-bottom:2px solid var(--nb);font-weight:bold}
.ps{display:flex;flex-direction:column;align-items:center;flex:1;padding:5px;border-radius:8px}
.ps.act{background:rgba(255,255,255,.1);transform:scale(1.05)}
.n1{color:var(--p1)}.n2{color:var(--p2)}
#timer{color:var(--nb);font-size:1.2rem;display:none;font-weight:800}
.mc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;max-width:800px;margin:0 auto;width:100%}
.scr{text-align:center;display:none;width:100%}.scr.act{display:block}
h1{font-size:2rem;background:linear-gradient(to right,var(--nb),var(--np));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:15px}
p{margin-bottom:20px;color:#aaa}
.ig{display:flex;flex-direction:column;gap:10px;max-width:350px;margin:0 auto}
.ig input{padding:12px;border-radius:8px;border:2px solid #444;background:rgba(0,0,0,.3);color:#fff;text-align:center;font-size:1.1rem}
.bg{display:grid;grid-template-columns:1fr;gap:10px;max-width:450px;margin:0 auto}
.bg.tc{grid-template-columns:1fr 1fr}
.ab{background:none;color:#fff;border:2px solid #444;padding:15px;font-size:1rem;font-weight:600;border-radius:10px;cursor:pointer}
.ab:hover{background:rgba(255,255,255,.1);border-color:var(--nb)}
.ab.ai{border-color:var(--np);background:rgba(255,0,234,.1)}
.qc{background:var(--p);border-radius:15px;padding:25px;text-align:left;margin-bottom:20px}
.qt{font-size:1.2rem;margin-bottom:15px;font-weight:600}
.hb{background:rgba(255,0,234,.1);color:var(--np);border:1px solid var(--np);padding:6px 12px;border-radius:5px;cursor:pointer;margin-bottom:15px;display:inline-block}
.hx{display:none;border-left:3px solid var(--np);padding:10px;margin-bottom:15px;color:#ccc;font-size:.9rem}
.oc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ob{background:rgba(255,255,255,.05);border:2px solid #444;color:#fff;padding:12px;font-size:1rem;border-radius:8px;cursor:pointer;text-align:left}
.ob:hover{background:rgba(255,255,255,.1)}
.ob.c{background:rgba(0,255,136,.2);border-color:var(--c);color:var(--c)}
.ob.w{background:rgba(255,51,102,.2);border-color:var(--w);color:var(--w)}
@media(max-width:600px){.oc,.bg.tc{grid-template-columns:1fr}.i-t{font-size:1.8rem}}
</style>
</head>
<body>
<div id="intro"><div class="i-t" id="it">MATEMATİK<br>ARENASI</div><div class="i-s" id="is">Zeka ve Hızın Buluşma Noktası</div><button class="i-b" id="ib" onclick="intro()">Sistemi Başlat</button></div>
<button class="snd" onclick="mute()" id="snd">🔊</button>
<div id="score"><div class="ps" id="p1pn"><div class="n1" id="p1n">OYUNCU 1</div><div id="p1sc">D:0 Y:0</div><div id="p1l">❤️❤️❤️</div></div><div style="text-align:center"><div>SORU: <span id="qc">1/5</span></div><div id="timer">⏱️ 30</div></div><div class="ps" id="p2pn" style="display:none"><div class="n2" id="p2n">OYUNCU 2</div><div id="p2sc">D:0 Y:0</div><div id="p2l">❤️❤️❤️</div></div></div>
<div class="mc">
<div class="scr act" id="s1"><h1>Kaç Oyuncu?</h1><p>Kapışmaya hazır mısın?</p><div class="bg tc"><button class="ab" onclick="mode('single')">👤 1 Oyuncu</button><button class="ab" onclick="mode('multi')">👥 2 Oyuncu</button></div></div>
<div class="scr" id="s2"><h1>İsimler?</h1><p>Kendinize isim verin.</p><div class="ig"><input id="i1" placeholder="1. Oyuncu" maxlength="10"><input id="i2" placeholder="2. Oyuncu" maxlength="10" style="display:none"><button class="ab" onclick="names()">DEVAM</button></div></div>
<div class="scr" id="s3"><h1>Konu Seç</h1><div class="bg"><button class="ab" onclick="topic('sayilar')">🔢 Sayılar</button><button class="ab" onclick="topic('kesirler')">📏 Kesirler</button><button class="ab" onclick="topic('olasilik')">🎲 Olasılık</button></div></div>
<div class="scr" id="s4"><h1>Zorluk</h1><div class="bg tc"><button class="ab" onclick="diff('kolay')">🟢 Kolay</button><button class="ab" onclick="diff('orta')">🟡 Orta</button><button class="ab" onclick="diff('zor')">🔴 Zor</button><button class="ab ai" onclick="diff('ai')">🤖 Yapay Zeka</button></div></div>
<div class="scr" id="s5"><h1>Soru Sayısı</h1><div class="bg tc"><button class="ab" onclick="start(5)">5</button><button class="ab" onclick="start(10)">10</button><button class="ab" onclick="start(15)">15</button><button class="ab" onclick="start(20)">20</button></div></div>
<div class="scr" id="s6"><div class="qc"><div class="qt" id="qt">Yükleniyor...</div><button class="hb" id="hb" onclick="hint()">💡 İpucu</button><div class="hx" id="hx"></div><div class="oc" id="oc"></div></div></div>
</div>
<script>
const AC=new(window.AudioContext||window.webkitAudioContext)();let mut=false;function mute(){mut=!mut;document.getElementById('snd').innerText=mut?"🔇":"🔊"}
function snd(t){if(mut)return;if(AC.state==='suspended')AC.resume();let o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);if(t==='c'){o.type='sine';o.frequency.setValueAtTime(600,AC.currentTime);o.frequency.exponentialRampToValueAtTime(1200,AC.currentTime+.1);g.gain.setValueAtTime(.3,AC.currentTime);g.gain.exponentialRampToValueAtTime(.01,AC.currentTime+.3);o.start();o.stop(AC.currentTime+.3)}else if(t==='w'){o.type='sawtooth';o.frequency.setValueAtTime(200,AC.currentTime);o.frequency.exponentialRampToValueAtTime(100,AC.currentTime+.3);g.gain.setValueAtTime(.3,AC.currentTime);g.gain.exponentialRampToValueAtTime(.01,AC.currentTime+.3);o.start();o.stop(AC.currentTime+.3)}}
function intro(){if(AC.state==='suspended')AC.resume();let o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='sine';o.frequency.setValueAtTime(150,AC.currentTime);o.frequency.exponentialRampToValueAtTime(30,AC.currentTime+1.5);g.gain.setValueAtTime(.6,AC.currentTime);g.gain.exponentialRampToValueAtTime(.01,AC.currentTime+1.5);o.start();o.stop(AC.currentTime+1.5);document.getElementById('ib').style.display='none';setTimeout(()=>{document.getElementById('it').classList.add('sh');setTimeout(()=>document.getElementById('is').classList.add('sh'),800)},500);setTimeout(()=>{document.getElementById('intro').style.opacity='0';setTimeout(()=>document.getElementById('intro').style.display='none',800)},3500)}

const QB={'sayilar':{'kolay':[{q:"12'nin en büyük çarpanı?",c:"12",w:["6","4","3"],h:"Kendisi"}],'orta':[{q:"4 ve 6'ya bölünen en küçük?",c:"12",w:["24","10","18"],h:"Katlar"}],'zor':[{q:"2 basamaklı en büyük asal?",c:"97",w:["99","91","89"],h:"99 asal değil"}]},'kesirler':{'kolay':[{q:"1/2 yüzde kaç?",c:"%50",w:["%20","%25","%100"],h:"Yarısı"}],'orta':[{q:"1,2 hangi kesir?",c:"12/10",w:["1/2","2/10","12/100"],h:"1 basamak"}],'zor':[{q:"0,1'den küçük?",c:"0,05",w:["0,2","0,15","0,11"],h:"Sıfıra yakın"}]},'olasilik':{'kolay':[{q:"İmkansız olay?",c:"0",w:["1","1/2","-1"],h:"Sıfır"}],'orta':[{q:"Zarda tek sayı?",c:"1/2",w:["1/3","1/6","2/3"],h:"1,3,5"}],'zor':[{q:"3 para kaç sonuç?",c:"8",w:["6","4","3"],h:"2x2x2"}]}};
let md='single',n1='OYUNCU 1',n2='OYUNCU 2',tp='',df='',rq=0,cq=0,ap=1,c1=0,w1=0,l1=3,c2=0,w2=0,l2=3,ca=true,qs=[],ti,tl=30;
function shuf(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mode(m){snd('c');md=m;document.getElementById('s1').classList.remove('act');document.getElementById('s2').classList.add('act');if(m==='multi')document.getElementById('i2').style.display='block'}
function names(){snd('c');let a=document.getElementById('i1').value.trim(),b=document.getElementById('i2').value.trim();n1=a?a.toUpperCase():'OYUNCU 1';if(md==='multi'){n2=b?b.toUpperCase():'OYUNCU 2';document.getElementById('p2pn').style.display='flex';document.getElementById('timer').style.display='block'}document.getElementById('p1n').innerText=n1;document.getElementById('p2n').innerText=n2;document.getElementById('s2').classList.remove('act');document.getElementById('s3').classList.add('act')}
function topic(t){snd('c');tp=t;document.getElementById('s3').classList.remove('act');document.getElementById('s4').classList.add('act')}
function diff(d){snd('c');df=d;document.getElementById('s4').classList.remove('act');document.getElementById('s5').classList.add('act')}
function gen(t){let a=Math.floor(Math.random()*20)+1,b=Math.floor(Math.random()*10)+1;if(t==='sayilar')return{q:`Yapay Zeka: ${a}x${b}?`,c:(a*b).toString(),w:[(a*b+2).toString(),(a*b-1).toString(),(a*b+5).toString()],h:"Çarp"};if(t==='kesirler')return{q:`Yapay Zeka: ${a}'nın yarısı?`,c:(a/2).toString().replace('.',','),w:[(a*2).toString(),(a/4).toString().replace('.',','),(a-2).toString()],h:"2'ye böl"};let to=Math.floor(Math.random()*10)+5,ta=Math.floor(Math.random()*to)+1;return{q:`Yapay Zeka: ${to} topun ${ta}'i kırmızı?`,c:`${ta}/${to}`,w:[`1/${to}`,`${ta}/${to+1}`,"1/2"],h:"İstenen/Toplam"}}
function start(c){snd('c');rq=c;document.getElementById('s5').classList.remove('act');document.getElementById('s6').classList.add('act');document.getElementById('score').style.display='flex';cq=0;c1=0;w1=0;l1=3;c2=0;w2=0;l2=3;ap=1;updSc();let p=[];if(df==='ai'){for(let i=0;i<rq;i++)p.push(gen(tp))}else{let b=QB[tp][df];while(b.length<rq)b=b.concat(b);p=shuf([...b]).slice(0,rq)}qs=p;shwQ()}
function shwQ(){ca=true;if(md==='multi'){document.getElementById(ap===1?'p1pn':'p2pn').classList.add('act');document.getElementById(ap===1?'p2pn':'p1pn').classList.remove('act')}else document.getElementById('p1pn').classList.add('act');const q=qs[cq];document.getElementById('qt').innerText=q.q;document.getElementById('qc').innerText=`${cq+1}/${qs.length}`;document.getElementById('hb').style.display='inline-block';document.getElementById('hx').style.display='none';document.getElementById('hx').innerText=q.h;let o=shuf([q.c,...q.w]);q.ci=o.indexOf(q.c);const ct=document.getElementById('oc');ct.innerHTML='';o.forEach((v,i)=>{let b=document.createElement('button');b.className='ob';b.innerText=`${String.fromCharCode(65+i)}) ${v}`;b.onclick=()=>chk(i,b);ct.appendChild(b)});if(md==='multi')stTm()}
function stTm(){clearInterval(ti);tl=30;let tb=document.getElementById('timer');tb.innerText=`⏱️ ${tl}`;ti=setInterval(()=>{tl--;tb.innerText=`⏱️ ${tl}`;if(tl<=0){clearInterval(ti);timeOut()}},1000)}
function timeOut(){if(!ca)return;ca=false;snd('w');document.querySelectorAll('.ob')[qs[cq].ci].classList.add('c');if(ap===1){w1++;l1--}else{w2++;l2--}updSc();setTimeout(nxt,2000)}
function hint(){snd('c');document.getElementById('hx').style.display='block';document.getElementById('hb').style.display='none'}
function chk(s,b){if(!ca)return;ca=false;clearInterval(ti);const ci=qs[cq].ci,ab=document.querySelectorAll('.ob');document.getElementById('hx').style.display='none';document.getElementById('hb').style.display='none';if(s===ci){snd('c');b.classList.add('c');if(ap===1)c1++;else c2++}else{snd('w');b.classList.add('w');ab[ci].classList.add('c');if(ap===1){w1++;l1--}else{w2++;l2--}}updSc();if((ap===1&&l1===0)||(ap===2&&l2===0)){setTimeout(end,1500);return}setTimeout(nxt,1500)}
function nxt(){cq++;if(cq<qs.length){if(md==='multi')ap=ap===1?2:1;shwQ()}else end()}
function updSc(){document.getElementById('p1sc').innerText=`D:${c1} Y:${w1}`;document.getElementById('p1l').innerText="❤️".repeat(l1)+"🖤".repeat(3-l1);if(md==='multi'){document.getElementById('p2sc').innerText=`D:${c2} Y:${w2}`;document.getElementById('p2l').innerText="❤️".repeat(l2)+"🖤".repeat(3-l2)}}
function end(){clearInterval(ti);const s=document.getElementById('s6');let t="",tc="var(--nb)",wt="",hm="";if(md==='single'){let r=localStorage.getItem('mhs')||0;if(c1>r){localStorage.setItem('mhs',c1);hm=`<p style="color:var(--np);font-weight:bold">🎉 YENİ REKOR!</p>`}else hm=`<p style="color:#aaa">Rekor: ${r}</p>`}if(md==='multi'){if(l1===0){t=`🏆 ${n2} KAZANDI!`;tc="var(--p2)";wt=`${n1} bitti.`}else if(l2===0){t=`🏆 ${n1} KAZANDI!`;tc="var(--p1)";wt=`${n2} bitti.`}else{if(c1>c2){t=`🏆 ${n1} KAZANDI!`;tc="var(--p1)"}else if(c2>c1){t=`🏆 ${n2} KAZANDI!`;tc="var(--p2)"}else{t="🤝 BERABERE!";tc="#fff"}wt="Bitti."}}else{t=l1===0?"💀 Bitti!":"🏆 Tamamlandı!";tc=l1===0?"var(--w)":"var(--nb)"}s.innerHTML=`<div class="qc" style="text-align:center"><h2 style="color:${tc};margin-bottom:10px">${t}</h2><p>${wt}</p>${hm}<div style="display:flex;gap:10px;margin:15px 0"><div style="background:rgba(56,189,248,.1);padding:10px;flex:1;border-radius:8px"><h3>${n1}</h3><p>D:${c1} Y:${w1}</p></div>${md==='multi'?`<div style="background:rgba(244,114,182,.1);padding:10px;flex:1;border-radius:8px"><h3>${n2}</h3><p>D:${c2} Y:${w2}</p></div>`:''}</div><button class="ab" onclick="location.reload()" style="width:100%;background:var(--nb);color:#000">ANA MENÜ</button></div>`;document.getElementById('score').style.display='none'}
</script>
</body>
</html>
