<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematik Arenası | Pro Sürüm</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.8);
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --correct: #00ff88;
            --wrong: #ff3366;
            --text-main: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(255, 0, 234, 0.1) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Üst Skor Paneli */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            font-weight: 800;
            font-size: 1.2rem;
            display: none; 
        }

        .score-box { color: var(--neon-blue); }
        .score-correct { color: var(--correct); }
        .score-wrong { color: var(--wrong); }

        /* Ana İçerik */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Ekranlar */
        .screen {
            text-align: center;
            animation: zoomIn 0.5s ease-out;
            width: 100%;
            display: none;
        }

        .screen.active {
            display: block;
        }
        
        .screen h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .screen p {
            margin-bottom: 30px;
            color: #aaa;
            font-size: 1.1rem;
        }

        /* Buton Izgaraları */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .btn-grid.two-col {
            grid-template-columns: 1fr 1fr;
        }

        .action-btn {
            background: transparent;
            color: white;
            border: 2px solid rgba(255,255,255,0.2);
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-btn.center-text {
            justify-content: center;
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--neon-blue);
            transform: translateY(-3px);
        }

        /* Sınav Ekranı */
        .question-card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            text-align: left;
            animation: slideInRight 0.4s ease-out;
        }

        .question-text {
            font-size: 1.3rem;
            margin-bottom: 20px;
            line-height: 1.5;
            color: white;
            font-weight: 600;
        }

        .hint-btn {
            background: rgba(255, 0, 234, 0.1);
            color: var(--neon-pink);
            border: 1px solid var(--neon-pink);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
            transition: all 0.2s;
            display: inline-block;
        }

        .hint-btn:hover {
            background: var(--neon-pink);
            color: white;
            box-shadow: 0 0 10px rgba(255, 0, 234, 0.5);
        }

        .hint-box {
            display: none; 
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--neon-pink);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            font-size: 1rem;
            color: #ddd;
            animation: fadeIn 0.3s ease-out;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-container { grid-template-columns: 1fr; }
            .btn-grid.two-col { grid-template-columns: 1fr; }
            .question-card { padding: 20px; }
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #666;
        }

        .option-btn.correct {
            background: rgba(0, 255, 136, 0.2);
            border-color: var(--correct);
            color: var(--correct);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        .option-btn.wrong {
            background: rgba(255, 51, 102, 0.2);
            border-color: var(--wrong);
            color: var(--wrong);
            animation: shake 0.4s;
        }

        /* Animasyonlar */
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes slideInRight {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <!-- Skor Tablosu -->
    <div class="scoreboard" id="scoreboard">
        <div class="score-box">SORU: <span id="question-counter">1/5</span></div>
        <div class="score-correct">DOĞRU: <span id="score-correct">0</span></div>
        <div class="score-wrong">YANLIŞ: <span id="score-wrong">0</span></div>
    </div>

    <div class="main-container">
        
        <!-- EKRAN 1: Konu Seçimi -->
        <div class="screen active" id="screen-topic">
            <h1>Matematik Arenası</h1>
            <p>Hangi konudan meydan okumak istersin?</p>
            <div class="btn-grid">
                <button class="action-btn" onclick="selectTopic('sayilar')">
                    <div>🔢 Sayılar ve Nicelikler</div>
                </button>
                <button class="action-btn" onclick="selectTopic('kesirler')">
                    <div>📏 Kesirler ve Ondalık</div>
                </button>
                <button class="action-btn" onclick="selectTopic('olasilik')">
                    <div>🎲 Veriden Olasılığa</div>
                </button>
            </div>
        </div>

        <!-- EKRAN 2: Soru Sayısı Seçimi -->
        <div class="screen" id="screen-count">
            <h1>Sınav Uzunluğu</h1>
            <p>Kaç soru çözmek istersin?</p>
            <div class="btn-grid two-col">
                <button class="action-btn center-text" onclick="startQuiz(5)">5 Soru</button>
                <button class="action-btn center-text" onclick="startQuiz(10)">10 Soru</button>
                <button class="action-btn center-text" onclick="startQuiz(15)">15 Soru</button>
                <button class="action-btn center-text" onclick="startQuiz(20)">20 Soru</button>
                <button class="action-btn center-text" onclick="startQuiz(25)">25 Soru</button>
                <button class="action-btn center-text" onclick="startQuiz(30)">30 Soru</button>
            </div>
        </div>

        <!-- EKRAN 3: Oyun (Sınav) -->
        <div class="screen" id="screen-quiz">
            <div class="question-card" id="question-card">
                <div class="question-text" id="question-text">Soru yükleniyor...</div>
                
                <button class="hint-btn" id="hint-btn" onclick="showHint()">💡 İpucu İste</button>
                <div class="hint-box" id="hint-box"></div>

                <div class="options-container" id="options-container">
                    <!-- Seçenekler buraya gelecek -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- SES MOTORU ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'click') {
                osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'hint') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // --- DEVASA SORU HAVUZU ---
        const questionBank = {
            'sayilar': [
                { q: "18 sayısının kaç tane çarpanı vardır?", c: "6", w: ["4", "5", "8"], h: "1x18, 2x9, 3x6 şeklinde ikili gruplar halinde bul." },
                { q: "Aşağıdakilerden hangisi bir asal sayıdır?", c: "19", w: ["9", "15", "21"], h: "9, 15 ve 21 sayıları 3'e bölünür. Peki 19 sadece hangi sayılara bölünür?" },
                { q: "24 sayısının asal çarpanları hangileridir?", c: "2 ve 3", w: ["2, 3 ve 4", "Sadece 2", "1, 2, 3"], h: "4 asal bir sayı değildir. 24'ü bölen en küçük asal sayıları bul." },
                { q: "Hem 4'e hem de 6'ya tam bölünebilen en küçük sayı kaçtır?", c: "12", w: ["24", "10", "18"], h: "4'ün katları: 4, 8, 12... 6'nın katları: 6, 12... İlk nerede buluşuyorlar?" },
                { q: "Aşağıdaki sayılardan hangisi 3 ile kalansız bölünür?", c: "123", w: ["124", "125", "128"], h: "3'e bölünme kuralı: Rakamların toplamı 3'ün katı olmalı. 1+2+3 kaç eder?" },
                { q: "Aşağıdaki sayılardan hangisi 5 ile kalansız bölünemez?", c: "32", w: ["10", "25", "40"], h: "5'e bölünen sayılar her zaman 0 veya 5 ile biter." },
                { q: "İki basamaklı en büyük asal sayı kaçtır?", c: "97", w: ["99", "91", "89"], h: "99, 3'e bölünür. 91 ise 7x13'tür. 97'yi bölen bir sayı var mı?" },
                { q: "20 sayısının asal çarpanlarının toplamı kaçtır?", c: "7", w: ["5", "9", "10"], h: "20'nin asal çarpanları 2 ve 5'tir (2x2x5). Bunları topla." },
                { q: "Aşağıdakilerden hangisi 4 ile tam bölünür?", c: "128", w: ["126", "130", "134"], h: "Son iki basamağı (28) 4'ün katı mı?" },
                { q: "1'den 10'a kadar olan sayılardan kaç tanesi asaldır?", c: "4", w: ["3", "5", "6"], h: "2, 3, 5 ve 7. Başka var mı?" },
                { q: "36 sayısının en büyük çarpanı kaçtır?", c: "36", w: ["18", "12", "9"], h: "Bir sayının en büyük çarpanı her zaman kendisidir." },
                { q: "15 ve 20 sayılarının ortak bölenlerinin en büyüğü (EBOB) kaçtır?", c: "5", w: ["3", "4", "10"], h: "15'i bölenler: 1, 3, 5, 15. 20'yi bölenler: 1, 2, 4, 5, 10, 20. En büyük ortak hangisi?" },
                { q: "Aşağıdakilerden hangisi çift asal sayıdır?", c: "2", w: ["4", "6", "8"], h: "Asal sayıların çoğu tektir. Sadece bir tanesi çifttir. Hangisi?" },
                { q: "50 sayısının kaç tane asal çarpanı vardır (farklı)?", c: "2", w: ["3", "4", "5"], h: "50 = 2 x 5 x 5. Farklı olanları say." },
                { q: "9'un 100'den küçük en büyük katı kaçtır?", c: "99", w: ["90", "98", "96"], h: "9x10=90. 9x11=99. 9x12=108. Cevap hangisi?" },
                { q: "Aşağıdaki sayılardan hangisi 9'a tam bölünür?", c: "81", w: ["72", "90", "99"], h: "Rakamları toplamı 9 veya 9'un katı olmalı. 8+1=9." },
                { q: "28 sayısının çarpanlarından kaç tanesi tektir?", c: "2", w: ["1", "3", "4"], h: "28 çift sayı olduğu için çarpanların çoğu çifttir. 1 ve 7'yi unutma." },
                { q: "İki asal sayının toplamı en az kaçtır?", c: "5", w: ["3", "4", "6"], h: "En küçük asal sayılar 2 ve 3'tür. Toplamları?" },
                { q: "Aşağıdakilerden hangisi 2, 3 ve 5'e tam bölünür?", c: "30", w: ["15", "20", "45"], h: "Bu sayı hem çift olmalı, hem rakamları toplamı 3'ün katı, hem de sonu 0 veya 5 olmalı." },
                { q: "42 sayısının en küçük asal çarpanı kaçtır?", c: "2", w: ["3", "6", "7"], h: "42 çift bir sayıdır. En küçük asal sayıyla başla." }
            ],
            'kesirler': [
                { q: "2/5 kesrinin ondalık gösterimi nedir?", c: "0,4", w: ["0,25", "0,5", "0,2"], h: "2'yi 5'e böl. 20'de 5, 4 kere var." },
                { q: "0,75 ondalık gösterimi hangi kesre eşittir?", c: "3/4", w: ["1/4", "1/2", "2/3"], h: "0,75 = 75/100. Sadeleştirirsen?" },
                { q: "1 kilometre (km) kaç metredir?", c: "1000 m", w: ["100 m", "10 m", "10000 m"], h: "Kilo öneki 1000 anlamına gelir." },
                { q: "3/4 + 1/4 işleminin sonucu nedir?", c: "1", w: ["4/8", "1/2", "4/4 (0)"], h: "Paydalar eşitse payları topla. 3+1=4. 4/4 kaç eder?" },
                { q: "500 cm kaç metredir?", c: "5 m", w: ["50 m", "0,5 m", "5000 m"], h: "100 cm = 1 m ise, 500 cm kaç m'dir?" },
                { q: "1/2 kesrinin yüzde karşılığı nedir?", c: "%50", w: ["%20", "%25", "%100"], h: "Yarım demek, bütünün yarısı demektir." },
                { q: "Hangisi daha büyüktür: 1/2 mi, 1/3 mü?", c: "1/2", w: ["1/3", "Eşittir", "Bilinemez"], h: "Bir pastayı 2'ye mi yoksa 3'e mi bölmek daha büyük dilim verir?" },
                { q: "0,5 + 0,25 işleminin sonucu nedir?", c: "0,75", w: ["0,30", "0,55", "1,0"], h: "Virgülleri alt alta getirerek topla." },
                { q: "1 dekametre (dam) kaç metredir?", c: "10 m", w: ["100 m", "1000 m", "0,1 m"], h: "Metreden bir basamak yukarı çıkıyoruz. Çarpı 10." },
                { q: "5/10 kesrinin en sade hali nedir?", c: "1/2", w: ["1/5", "2/5", "5/5"], h: "Hem 5'i hem 10'u 5'e bölebilirsin." },
                { q: "1,2 sayısı hangi kesre eşittir?", c: "12/10", w: ["1/2", "2/10", "12/100"], h: "Virgülden sonra bir basamak var, o zaman payda 10 olacak." },
                { q: "3 metre kaç santimetredir?", c: "300 cm", w: ["30 cm", "3000 cm", "0,3 cm"], h: "1 m = 100 cm. 3 ile çarp." },
                { q: "1/4 + 2/4 işleminin sonucu nedir?", c: "3/4", w: ["3/8", "2/4", "1/2"], h: "Paydalar aynı, sadece üstteki sayıları topla." },

                { q: "2/3 kesri, bütünün ne kadarını ifade eder?", c: "Üçte ikisini", w: ["Yarısını", "Dörtte birini", "Tamamını"], h: "Payda 3, pay 2. 3 parçaya bölünmüş, 2'si alınmış." },

                { q: "Kesin gerçekleşecek bir olayın olasılığı kaçtır?", c: "1", w: ["0", "1/2", "100/10"], h: "Güneşin doğması gibi düşün, ihtimal %100." },
                { q: "Hilesiz bir madeni para atıldığında 'Yazı' gelme olasılığı?", c: "1/2", w: ["1", "0", "1/4"], h: "İki yüz var, biri bizim istediğimiz." },
                { q: "Bir zar atıldığında 6'dan küçük sayı gelme olasılığı?", c: "5/6", w: ["1/6", "1/2", "4/6"], h: "1, 2, 3, 4, 5 gelirse 6'dan küçük olur. 6 hariç hepsi." },
                { q: "Torbada 4 mavi, 4 kırmızı top var. Mavi çekme olasılığı?", c: "1/2", w: ["1/4", "3/4", "2/5"], h: "Toplam 8 top var. 4 tanesi mavi. 4/8 sadeleşir mi?" },
                { q: "Bir zar atıldığında asal sayı gelme olasılığı?", c: "1/2", w: ["1/3", "2/3", "1/6"], h: "Zardaki asal sayılar: 2, 3 ve 5. (3 tane)." },
                { q: "Bir torbada sadece siyah toplar varsa, siyah çekme olasılığı?", c: "1", w: ["0", "1/2", "1/10"], h: "Kesin bir olay. Başka renk yok." },
                { q: "Bir zar atıldığında 1 veya 2 gelme olasılığı?", c: "2/6", w: ["1/6", "3/6", "2/2"], h: "2 tane istenen durum var, 6 tane toplam. Sadeleştir." },
                { q: "Torbada 5 sarı, 5 siyah top var. Sarı gelmeme olasılığı?", c: "1/2", w: ["5", "1/5", "0"], h: "Sarı gelmeme = Siyah gelme. Kaç tane siyah var, kaç tane toplam top var?" },
                { q: "Bir zar atıldığında 8 gelme olasılığı kaçtır?", c: "0", w: ["1/8", "1/6", "1/2"], h: "Zarda 8 var mı?" },
                { q: "3 madeni para aynı anda atılırsa kaç farklı sonuç çıkabilir?", c: "8", w: ["6", "4", "3"], h: "Her paranın 2 yüzü var. 2 x 2 x 2 = ?" },
                { q: "Hilesiz bir zar atıldığında üst yüze gelen sayının 2'den büyük olma olasılığı?", c: "4/6", w: ["2/6", "3/6", "5/6"], h: "2'den büyükler: 3, 4, 5, 6. Yani 4 tane." },
                { q: "İçinde 3 kırmızı, 2 beyaz top olan torbadan beyaz çekme olasılığı?", c: "2/5", w: ["3/5", "1/2", "2/3"], h: "Toplam 5 top var, 2 tanesi beyaz." },
                { q: "Bir zar atıldığında çift veya 3 gelme olasılığı?", c: "4/6", w: ["3/6", "1/6", "5/6"], h: "Çiftler: 2, 4, 6. Bir de 3 var. Toplam 4 istenen durum." },
                { q: "Olasılık değeri hangi aralıkta olur?", c: "0 ile 1 arası", w: ["1 ile 10 arası", "0 ile 100 arası", "Negatif sayılar"], h: "Yüzde olarak düşün: %0 ile %100 (yani 1) arası." },
                { q: "Torbada 10 top var. Kırmızı gelme olasılığı 1/2 ise kaç kırmızı top vardır?", c: "5", w: ["2", "10", "1"], h: "Toplam 10'un yarısı (1/2) kaç eder?" },
                { q: "Bir zar atıldığında 5'ten küçük gelme olasılığı?", c: "4/6", w: ["5/6", "1/6", "3/6"], h: "5'ten küçükler: 1, 2, 3, 4." }
            ]
        };

        let currentTopic = "";
        let requestedQuestionCount = 0;
        let currentQuestion = 0;
        let correctScore = 0;
        let wrongScore = 0;
        let canAnswer = true;
        let selectedQuestions = []; 

        // --- DİZİYİ KARIŞTIRMA ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- KONU SEÇİMİ ---
        function selectTopic(topic) {
            playSound('click');
            currentTopic = topic;
            document.getElementById('screen-topic').classList.remove('active');
            document.getElementById('screen-count').classList.add('active');
        }

        // --- OYUNU BAŞLAT ---
        function startQuiz(count) {
            playSound('click');
            requestedQuestionCount = count;

            document.getElementById('screen-count').classList.remove('active');
            document.getElementById('screen-quiz').classList.add('active');
            document.getElementById('scoreboard').style.display = 'flex';
            
            currentQuestion = 0;
            correctScore = 0;
            wrongScore = 0;
            updateScoreboard();

            let pool = questionBank[currentTopic];
            let shuffledPool = shuffleArray([...pool]); 
            
            if (requestedQuestionCount > shuffledPool.length) {
                selectedQuestions = shuffledPool;
            } else {
                selectedQuestions = shuffledPool.slice(0, requestedQuestionCount);
            }

            showQuestion();
        }

        // --- SORUYU GÖSTER ---
        function showQuestion() {
            canAnswer = true;
            const qData = selectedQuestions[currentQuestion];
            
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('question-counter').innerText = `${currentQuestion + 1}/${selectedQuestions.length}`;

            document.getElementById('hint-btn').style.display = 'inline-block';
            const hintBox = document.getElementById('hint-box');
            hintBox.style.display = 'none';
            hintBox.innerText = qData.h; 

            let allOptions = [qData.c, ...qData.w]; 
            allOptions = shuffleArray(allOptions);
            const newCorrectIndex = allOptions.indexOf(qData.c);
            qData.currentCorrectIndex = newCorrectIndex; 

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; 

            allOptions.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${String.fromCharCode(65 + index)}) ${option}`; 
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            const qCard = document.getElementById('question-card');
            qCard.style.animation = 'none';
            qCard.offsetHeight; 
            qCard.style.animation = 'slideInRight 0.4s ease-out';
        }

        // --- İPUCUNU GÖSTER ---
        function showHint() {
            playSound('hint'); 
            const hintBox = document.getElementById('hint-box');
            const hintBtn = document.getElementById('hint-btn');
            
            if(hintBox.style.display === 'none' || hintBox.style.display === '') {
                hintBox.style.display = 'block';
                hintBtn.style.display = 'none'; 
            }
        }

        // --- CEVABI KONTROL ET ---
        function checkAnswer(selectedIndex, btnElement) {
            if (!canAnswer) return; 
            canAnswer = false;

            const correctIndex = selectedQuestions[currentQuestion].currentCorrectIndex;
            const allButtons = document.querySelectorAll('.option-btn');

            document.getElementById('hint-box').style.display = 'none';
            document.getElementById('hint-btn').style.display = 'none';

            if (selectedIndex === correctIndex) {
                playSound('correct');
                btnElement.classList.add('correct');
                correctScore++;
            } else {
                playSound('wrong');
                btnElement.classList.add('wrong');
                allButtons[correctIndex].classList.add('correct'); 
                wrongScore++;
            }

            updateScoreboard();

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < selectedQuestions.length) {
                    showQuestion();
                } else {
                    endQuiz();
                }
            }, 1500);
        }

        function updateScoreboard() {
            document.getElementById('score-correct').innerText = correctScore;
            document.getElementById('score-wrong').innerText = wrongScore;
        }

        // --- OYUNU BİTİR ---
        function endQuiz() {
            const quizScreen = document.getElementById('screen-quiz');
            quizScreen.innerHTML = `
                <div class="question-card" style="text-align: center;">
                    <h2 style="color: var(--neon-blue); font-size: 2rem; margin-bottom: 20px;">Meydan Okuma Tamamlandı!</h2>
                    <p style="font-size: 1.2rem; margin-bottom: 20px;">Doğru Sayın: <span style="color: var(--correct); font-weight: bold; font-size: 1.5rem;">${correctScore}</span></p>
                    <p style="font-size: 1.2rem; margin-bottom: 30px;">Yanlış Sayın: <span style="color: var(--wrong); font-weight: bold; font-size: 1.5rem;">${wrongScore}</span></p>
                    <button class="action-btn center-text" onclick="location.reload()" style="background: var(--neon-blue); color: black; border: none; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1.1rem; width: 100%;">ANA MENÜYE DÖN</button>
                </div>
            `;
            document.getElementById('scoreboard').style.display = 'none';
        }
    </script>
</body>
</html>
