<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematik Arenası | Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.8);
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --correct: #00ff88;
            --wrong: #ff3366;
            --text-main: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(255, 0, 234, 0.1) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Üst Skor ve Can Paneli */
        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 20px;
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            font-weight: 800;
            font-size: 1.1rem;
            display: none; 
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .score-box { color: var(--neon-blue); }
        .score-correct { color: var(--correct); }
        .score-wrong { color: var(--wrong); }
        
        /* Canlar (Kalpler) */
        .lives-display {
            font-size: 1.5rem;
            letter-spacing: 5px;
            transition: all 0.3s;
        }
        .heart-lost {
            animation: heartBreak 0.5s forwards;
        }

        /* Ana İçerik */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Ekranlar */
        .screen {
            text-align: center;
            animation: zoomIn 0.5s ease-out;
            width: 100%;
            display: none;
        }

        .screen.active { display: block; }
        
        .screen h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .screen p {
            margin-bottom: 30px;
            color: #aaa;
            font-size: 1.1rem;
        }

        /* Buton Izgaraları */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .btn-grid.two-col { grid-template-columns: 1fr 1fr; }

        .action-btn {
            background: transparent;
            color: white;
            border: 2px solid rgba(255,255,255,0.2);
            padding: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--neon-blue);
            transform: translateY(-3px);
        }
        
        .action-btn.ai-btn {
            border-color: var(--neon-pink);
            background: rgba(255, 0, 234, 0.1);
            color: #fff;
        }
        .action-btn.ai-btn:hover {
            background: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 234, 0.5);
        }

        /* Sınav Ekranı */
        .question-card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            text-align: left;
            animation: slideInRight 0.4s ease-out;
        }

        .question-text {
            font-size: 1.3rem;
            margin-bottom: 20px;
            line-height: 1.5;
            color: white;
            font-weight: 600;
        }

        .hint-btn {
            background: rgba(255, 0, 234, 0.1);
            color: var(--neon-pink);
            border: 1px solid var(--neon-pink);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
            transition: all 0.2s;
            display: inline-block;
        }

        .hint-box {
            display: none; 
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--neon-pink);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            font-size: 1rem;
            color: #ddd;
            animation: fadeIn 0.3s ease-out;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-container { grid-template-columns: 1fr; }
            .btn-grid.two-col { grid-template-columns: 1fr; }
            .question-card { padding: 20px; }
            .scoreboard { font-size: 0.9rem; padding: 10px; }
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #666;
        }

        .option-btn.correct {
            background: rgba(0, 255, 136, 0.2);
            border-color: var(--correct);
            color: var(--correct);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        .option-btn.wrong {
            background: rgba(255, 51, 102, 0.2);
            border-color: var(--wrong);
            color: var(--wrong);
            animation: shake 0.4s;
        }

        /* Animasyonlar */
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
        @keyframes heartBreak { 0% { transform: scale(1); } 50% { transform: scale(1.5); color: red; } 100% { transform: scale(1); opacity: 0.3; } }
    </style>
</head>
<body>

    <!-- Skor ve Can Tablosu -->
    <div class="scoreboard" id="scoreboard">
        <div class="score-box">SORU: <span id="question-counter">1/5</span></div>
        <div class="score-correct">DOĞRU: <span id="score-correct">0</span></div>
        <div class="score-wrong">YANLIŞ: <span id="score-wrong">0</span></div>
        <div class="lives-display" id="lives-display">❤️❤️❤️</div>
    </div>

    <div class="main-container">
        
        <!-- EKRAN 1: Konu Seçimi -->
        <div class="screen active" id="screen-topic">
            <h1>Matematik Arenası</h1>
            <p>Hangi konudan meydan okumak istersin?</p>
            <div class="btn-grid">
                <button class="action-btn" onclick="selectTopic('sayilar')">🔢 Sayılar ve Nicelikler</button>
                <button class="action-btn" onclick="selectTopic('kesirler')">📏 Kesirler ve Ondalık</button>
                <button class="action-btn" onclick="selectTopic('olasilik')">🎲 Veriden Olasılığa</button>
            </div>
        </div>

        <!-- EKRAN 2: Zorluk Seçimi -->
        <div class="screen" id="screen-difficulty">
            <h1>Zorluk Seviyesi</h1>
            <p>Kendine ne kadar güveniyorsun?</p>
            <div class="btn-grid two-col">
                <button class="action-btn" onclick="selectDifficulty('kolay')">🟢 Kolay</button>
                <button class="action-btn" onclick="selectDifficulty('orta')">🟡 Orta</button>
                <button class="action-btn" onclick="selectDifficulty('zor')">🔴 Zor</button>
                <button class="action-btn ai-btn" onclick="selectDifficulty('ai')">🤖 Yapay Zeka Modu</button>
            </div>
        </div>

        <!-- EKRAN 3: Soru Sayısı Seçimi -->
        <div class="screen" id="screen-count">
            <h1>Sınav Uzunluğu</h1>
            <p>Kaç soru çözmek istersin?</p>
            <div class="btn-grid two-col">
                <button class="action-btn" onclick="startQuiz(5)">5 Soru</button>
                <button class="action-btn" onclick="startQuiz(10)">10 Soru</button>
                <button class="action-btn" onclick="startQuiz(15)">15 Soru</button>
                <button class="action-btn" onclick="startQuiz(20)">20 Soru</button>
                <button class="action-btn" onclick="startQuiz(25)">25 Soru</button>
                <button class="action-btn" onclick="startQuiz(30)">30 Soru</button>
            </div>
        </div>

        <!-- EKRAN 4: Oyun (Sınav) -->
        <div class="screen" id="screen-quiz">
            <div class="question-card" id="question-card">
                <div class="question-text" id="question-text">Soru yükleniyor...</div>
                
                <button class="hint-btn" id="hint-btn" onclick="showHint()">💡 İpucu İste</button>
                <div class="hint-box" id="hint-box"></div>

                <div class="options-container" id="options-container"></div>
            </div>
        </div>

    </div>

    <script>
        // --- SES MOTORU ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'click') {
                osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'hint') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.8);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.start(); osc.stop(audioCtx.currentTime + 0.8);
            }
        }

        // --- SORU HAVUZLARI (Zorluklara Göre) ---
        const questionBank = {
            'sayilar': {
                'kolay': [
                    { q: "12 sayısının en büyük çarpanı kaçtır?", c: "12", w: ["6", "4", "3"], h: "Bir sayının en büyük çarpanı her zaman kendisidir." },
                    { q: "Aşağıdakilerden hangisi çift sayıdır?", c: "14", w: ["15", "17", "19"], h: "Çift sayılar 2'ye kalansız bölünür. (0,2,4,6,8 ile biter)." },
                    { q: "1'den 10'a kadar olan sayılardan kaç tanesi asaldır?", c: "4", w: ["3", "5", "6"], h: "2, 3, 5 ve 7. Başka var mı?" },
                    { q: "15 sayısı 3'e tam bölünür mü?", c: "Evet", w: ["Hayır", "Bazen", "Bilinemez"], h: "1+5=6. 6, 3'ün katı mıdır?" },
                    { q: "20 sayısının kaç tane çarpanı vardır?", c: "6", w: ["4", "5", "8"], h: "1x20, 2x10, 4x5 şeklinde ikili gruplar halinde bul." }
                ],
                'orta': [
                    { q: "Hem 4'e hem de 6'ya tam bölünebilen en küçük sayı kaçtır?", c: "12", w: ["24", "10", "18"], h: "4'ün katları: 4, 8, 12... 6'nın katları: 6, 12... İlk nerede buluşuyorlar?" },
                    { q: "Aşağıdaki sayılardan hangisi 3 ile kalansız bölünür?", c: "123", w: ["124", "125", "128"], h: "3'e bölünme kuralı: Rakamların toplamı 3'ün katı olmalı. 1+2+3 kaç eder?" },
                    { q: "15 ve 20 sayılarının ortak bölenlerinin en büyüğü (EBOB) kaçtır?", c: "5", w: ["3", "4", "10"], h: "15'i bölenler: 1, 3, 5, 15. 20'yi bölenler: 1, 2, 4, 5, 10, 20." },
                    { q: "20 sayısının asal çarpanlarının toplamı kaçtır?", c: "7", w: ["5", "9", "10"], h: "20'nin asal çarpanları 2 ve 5'tir (2x2x5). Bunları topla." },
                    { q: "Aşağıdakilerden hangisi 2, 3 ve 5'e tam bölünür?", c: "30", w: ["15", "20", "45"], h: "Bu sayı hem çift olmalı, hem rakamları toplamı 3'ün katı, hem de sonu 0 veya 5 olmalı." }
                ],
                'zor': [
                    { q: "İki basamaklı en büyük asal sayı kaçtır?", c: "97", w: ["99", "91", "89"], h: "99, 3'e bölünür. 91 ise 7x13'tür. 97'yi bölen bir sayı var mı?" },
                    { q: "İki asal sayının toplamı en az kaçtır?", c: "5", w: ["3", "4", "6"], h: "En küçük asal sayılar 2 ve 3'tür. Toplamları?" },
                    { q: "28 sayısının çarpanlarından kaç tanesi tektir?", c: "2", w: ["1", "3", "4"], h: "28 çift sayı olduğu için çarpanların çoğu çifttir. 1 ve 7'yi unutma." },
                    { q: "9'un 100'den küçük en büyük katı kaçtır?", c: "99", w: ["90", "98", "96"], h: "9x10=90. 9x11=99. 9x12=108." },
                    { q: "50 sayısının kaç tane asal çarpanı vardır (farklı)?", c: "2", w: ["3", "4", "5"], h: "50 = 2 x 5 x 5. Farklı olanları say." }
                ]
            },
            'kesirler': {
                'kolay': [
                    { q: "1/2 kesrinin yüzde karşılığı nedir?", c: "%50", w: ["%20", "%25", "%100"], h: "Yarım demek, bütünün yarısı demektir." },
                    { q: "1/4 + 2/4 işleminin sonucu nedir?", c: "3/4", w: ["3/8", "2/4", "1/2"], h: "Paydalar aynı, sadece üstteki sayıları topla." },
                    { q: "1/3 + 1/3 + 1/3 işleminin sonucu nedir?", c: "1", w: ["3/6", "1/3", "2/3"], h: "Üç tane 1/3 birleşirse bir bütün eder." },
                    { q: "1 saat kaç dakikadır?", c: "60", w: ["100", "30", "24"], h: "Zaman ölçüsü, klasik bilgi." },
                    { q: "2/5 kesrinin ondalık gösterimi nedir?", c: "0,4", w: ["0,25", "0,5", "0,2"], h: "2'yi 5'e böl. 20'de 5, 4 kere var." }
                ],
                'orta': [
                    { q: "1,2 sayısı hangi kesre eşittir?", c: "12/10", w: ["1/2", "2/10", "12/100"], h: "Virgülden sonra bir basamak var, o zaman payda 10 olacak." },
                    { q: "0,6 - 0,2 işleminin sonucu nedir?", c: "0,4", w: ["0,8", "0,3", "0,12"], h: "6'dan 2 çıkarsa 4 kalır. Virgül aynı hizada." },
                    { q: "0,5 + 0,25 işleminin sonucu nedir?", c: "0,75", w: ["0,30", "0,55", "1,0"], h: "Virgülleri alt alta getirerek topla." },
                    { q: "3 metre kaç santimetredir?", c: "300 cm", w: ["30 cm", "3000 cm", "0,3 cm"], h: "1 m = 100 cm. 3 ile çarp." },
                    { q: "Bir bütünün 1/8'i, yüzde kaçtır?", c: "12,5", w: ["8", "18", "25"], h: "100'ü 8'e bölersen kaç çıkar? (100/8)" }
                ],
                'zor': [
                    { q: "Aşağıdakilerden hangisi 0,1'den küçüktür?", c: "0,05", w: ["0,2", "0,15", "0,11"], h: "Ondalık sayılarda sola doğru gidildikçe sayı küçülür." },
                    { q: "1 metre + 50 cm toplamı kaç cm'dir?", c: "150 cm", w: ["51 cm", "105 cm", "1500 cm"], h: "Önce 1 metreyi cm'ye çevir (100 cm), sonra 50 ile topla." },
                    { q: "Hangisi daha büyüktür: 1/2 mi, 1/3 mü?", c: "1/2", w: ["1/3", "Eşittir", "Bilinemez"], h: "Bir pastayı 2'ye mi yoksa 3'e mi bölmek daha büyük dilim verir?" },
                    { q: "0,75 ondalık gösterimi hangi kesre eşittir?", c: "3/4", w: ["1/4", "1/2", "2/3"], h: "0,75 = 75/100. Sadeleştirirsen?" },
                    { q: "500 cm kaç metredir?", c: "5 m", w: ["50 m", "0,5 m", "5000 m"], h: "100 cm = 1 m ise, 500 cm kaç m'dir?" }
                ]
            },
            'olasilik': {
                'kolay': [
                    { q: "İmkansız bir olayın olasılığı kaçtır?", c: "0", w: ["1", "1/2", "-1"], h: "Hiç gerçekleşmeyecek bir şeyin şansı yüzde kaçtır?" },
                    { q: "Kesin gerçekleşecek bir olayın olasılığı kaçtır?", c: "1", w: ["0", "1/2", "100/10"], h: "Güneşin doğması gibi düşün, ihtimal %100." },
                    { q: "Hilesiz bir madeni para atıldığında 'Yazı' gelme olasılığı?", c: "1/2", w: ["1", "0", "1/4"], h: "İki yüz var, biri bizim istediğimiz." },
                    { q: "Bir zar atıldığında 3 gelme olasılığı kaçtır?", c: "1/6", w: ["1/3", "1/2", "1/4"], h: "Zarda 6 yüz var ve sadece 1 tanesi 3." },
                    { q: "Bir zar atıldığında 8 gelme olasılığı kaçtır?", c: "0", w: ["1/8", "1/6", "1/2"], h: "Zarda 8 var mı?" }
                ],
                'orta': [
                    { q: "Bir zar atıldığında tek sayı gelme olasılığı kaçtır?", c: "1/2", w: ["1/3", "1/6", "2/3"], h: "Tek sayılar: 1, 3, 5. Yani 3 tane. 3/6 sadeleşirse?" },
                    { q: "Torbada 2 kırmızı, 3 yeşil top var. Yeşil çekme olasılığı?", c: "3/5", w: ["2/5", "1/2", "1/3"], h: "Toplam 5 top var. 3 tanesi yeşil." },
                    { q: "Bir zar atıldığında 6'dan küçük sayı gelme olasılığı?", c: "5/6", w: ["1/6", "1/2","4/6"], h: "1, 2, 3, 4, 5 gelirse 6'dan küçük olur. 6 hariç hepsi." },
                    { q: "Torbada 4 mavi, 4 kırmızı top var. Mavi çekme olasılığı?", c: "1/2", w: ["1/4", "3/4", "2/5"], h: "Toplam 8 top var. 4 tanesi mavi. 4/8 sadeleşir mi?" },
                    { q: "Bir zar atıldığında asal sayı gelme olasılığı?", c: "1/2", w: ["1/3", "2/3", "1/6"], h: "Zardaki asal sayılar: 2, 3 ve 5. (3 tane)." }
                ],
                'zor': [
                    { q: "Torbada 5 sarı, 5 siyah top var. Sarı gelmeme olasılığı?", c: "1/2", w: ["5", "1/5", "0"], h: "Sarı gelmeme = Siyah gelme. Kaç tane siyah var, kaç tane toplam top var?" },
                    { q: "3 madeni para aynı anda atılırsa kaç farklı sonuç çıkabilir?", c: "8", w: ["6", "4", "3"], h: "Her paranın 2 yüzü var. 2 x 2 x 2 = ?" },
                    { q: "Hilesiz bir zar atıldığında üst yüze gelen sayının 2'den büyük olma olasılığı?", c: "4/6", w: ["2/6", "3/6", "5/6"], h: "2'den büyükler: 3, 4, 5, 6. Yani 4 tane." },
                    { q: "İçinde 3 kırmızı, 2 beyaz top olan torbadan beyaz çekme olasılığı?", c: "2/5", w: ["3/5", "1/2", "2/3"], h: "Toplam 5 top var, 2 tanesi beyaz." },
                    { q: "Bir zar atıldığında çift veya 3 gelme olasılığı?", c: "4/6", w: ["3/6", "1/6", "5/6"], h: "Çiftler: 2, 4, 6. Bir de 3 var. Toplam 4 istenen durum." }
                ]
            }
        };

        let currentTopic = "";
        let currentDifficulty = "";
        let requestedQuestionCount = 0;
        let currentQuestion = 0;
        let correctScore = 0;
        let wrongScore = 0;
        let lives = 3;
        let canAnswer = true;
        let selectedQuestions = []; 

        // --- DİZİYİ KARIŞTIRMA ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- KONU SEÇİMİ ---
        function selectTopic(topic) {
            playSound('click');
            currentTopic = topic;
            document.getElementById('screen-topic').classList.remove('active');
            document.getElementById('screen-difficulty').classList.add('active');
        }

        // --- ZORLUK SEÇİMİ ---
        function selectDifficulty(diff) {
            playSound('click');
            currentDifficulty = diff;
            document.getElementById('screen-difficulty').classList.remove('active');
            document.getElementById('screen-count').classList.add('active');
        }

        // --- YAPAY ZEKA SORU ÜRETİCİ (SİMÜLASYON) ---
        function generateAISoru(topic) {
            let a = Math.floor(Math.random() * 20) + 1;
            let b = Math.floor(Math.random() * 10) + 1;
            let correct, wrongs, qText, hint;

            if (topic === 'sayilar') {
                let ops = ['bolunme', 'çarpan', 'asal'];
                let op = ops[Math.floor(Math.random() * ops.length)];
                if (op === 'bolunme') {
                    let divisor = [2, 3, 5][Math.floor(Math.random() * 3)];
                    let num = divisor * (Math.floor(Math.random() * 20) + 1);
                    qText = `Yapay Zeka Soruyor: ${num} sayısı aşağıdakilerden hangisine tam bölünür?`;
                    correct = divisor.toString();
                    wrongs = ["7", "9", "11"].filter(x => x !== correct.toString()).slice(0,3);
                    hint = "Bölünebilme kurallarını düşün.";
                } else {
                    qText = `Yapay Zeka Soruyor: ${a} x ${b} işleminin sonucu kaçtır?`;
                    correct = (a * b).toString();
                    wrongs = [(a * b + 2).toString(), (a * b - 1).toString(), (a * b + 5).toString()];
                    hint = "Çarpma işlemini kullan.";
                }
            } else if (topic === 'kesirler') {
                qText = `Yapay Zeka Soruyor: ${a} sayısının yarısı (1/2'si) kaçtır?`;
                correct = (a / 2).toString().replace('.', ',');
                wrongs = [(a * 2).toString(), (a / 4).toString().replace('.', ','), (a - 2).toString()];
                hint = "Sayıyı 2'ye böl.";
            } else {
                let total = Math.floor(Math.random() * 10) + 5;
                let target = Math.floor(Math.random() * total) + 1;
                qText = `Yapay Zeka Soruyor: İçinde ${total} top olan torbada ${target} kırmızı top var. Kırmızı çekme olasılığı?`;
                correct = `${target}/${total}`;
                wrongs = [`1/${total}`, `${target}/${total+1}`, `1/2`];
                hint = "İstenen durum / Toplam durum.";
            }

            let options = [correct, ...wrongs];
            return { q: qText, c: correct, w: options.filter(x => x !== correct).slice(0,3), h: hint };
        }

        // --- OYUNU BAŞLAT ---
        function startQuiz(count) {
            playSound('click');
            requestedQuestionCount = count;

            document.getElementById('screen-count').classList.remove('active');
            document.getElementById('screen-quiz').classList.add('active');
            document.getElementById('scoreboard').style.display = 'flex';
            
            currentQuestion = 0;
            correctScore = 0;
            wrongScore = 0;
            lives = 3;
            updateScoreboard();
            updateLives();

            let pool = [];

            if (currentDifficulty === 'ai') {
                for (let i = 0; i < requestedQuestionCount; i++) {
                    pool.push(generateAISoru(currentTopic));
                }
            } else {
                let basePool = questionBank[currentTopic][currentDifficulty];
                while(basePool.length < requestedQuestionCount) {
                    basePool = basePool.concat(basePool);
                }
                pool = shuffleArray([...basePool]).slice(0, requestedQuestionCount);
            }
            
            selectedQuestions = pool;
            showQuestion();
        }

        // --- SORUYU GÖSTER ---
        function showQuestion() {
            canAnswer = true;
            const qData = selectedQuestions[currentQuestion];
            
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('question-counter').innerText = `${currentQuestion + 1}/${selectedQuestions.length}`;

            document.getElementById('hint-btn').style.display = 'inline-block';
            const hintBox = document.getElementById('hint-box');
            hintBox.style.display = 'none';
            hintBox.innerText = qData.h || "Bu soru için ipucu yok, kendine güven!";

            let allOptions = [qData.c, ...qData.w]; 
            allOptions = shuffleArray(allOptions);
            const newCorrectIndex = allOptions.indexOf(qData.c);
            qData.currentCorrectIndex = newCorrectIndex; 

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; 

            allOptions.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${String.fromCharCode(65 + index)}) ${option}`; 
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            const qCard = document.getElementById('question-card');
            qCard.style.animation = 'none';
            qCard.offsetHeight; 
            qCard.style.animation = 'slideInRight 0.4s ease-out';
        }

        // --- İPUCUNU GÖSTER ---
        function showHint() {
            playSound('hint'); 
            const hintBox = document.getElementById('hint-box');
            const hintBtn = document.getElementById('hint-btn');
            
            if(hintBox.style.display === 'none' || hintBox.style.display === '') {
                hintBox.style.display = 'block';
                hintBtn.style.display = 'none'; 
            }
        }

        // --- CANLARI GÜNCELLE ---
        function updateLives() {
            const display = document.getElementById('lives-display');
            if (lives === 3) display.innerText = "❤️❤️❤️";
            else if (lives === 2) display.innerText = "❤️❤️🖤";
            else if (lives === 1) display.innerText = "❤️🖤🖤";
            else display.innerText = "🖤🖤🖤";
        }

        // --- CEVABI KONTROL ET ---
        function checkAnswer(selectedIndex, btnElement) {
            if (!canAnswer) return; 
            canAnswer = false;

            const correctIndex = selectedQuestions[currentQuestion].currentCorrectIndex;
            const allButtons = document.querySelectorAll('.option-btn');

            document.getElementById('hint-box').style.display = 'none';
            document.getElementById('hint-btn').style.display = 'none';

            if (selectedIndex === correctIndex) {
                playSound('correct');
                btnElement.classList.add('correct');
                correctScore++;
            } else {
                playSound('wrong');
                btnElement.classList.add('wrong');
                allButtons[correctIndex].classList.add('correct'); 
                wrongScore++;
                lives--; 
                updateLives();
            }

            updateScoreboard();

            if (lives === 0) {
                setTimeout(() => {
                    playSound('gameover');
                    endQuiz(true); 
                }, 1500);
                return;
            }

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < selectedQuestions.length) {
                    showQuestion();
                } else {
                    endQuiz(false); 
                }
            }, 1500);
        }

        function updateScoreboard() {
            document.getElementById('score-correct').innerText = correctScore;
            document.getElementById('score-wrong').innerText = wrongScore;
        }

        // --- OYUNU BİTİR ---
        function endQuiz(isGameOver) {
            const quizScreen = document.getElementById('screen-quiz');
            let title = isGameOver ? "💀 Canın Bitti! Oyun Bitti." : "🏆 Meydan Okuma Tamamlandı!";
            let titleColor = isGameOver ? "var(--wrong)" : "var(--neon-blue)";

            quizScreen.innerHTML = `
                <div class="question-card" style="text-align: center; animation: zoomIn 0.5s ease-out;">
                    <h2 style="color: ${titleColor}; font-size: 2rem; margin-bottom: 20px;">${title}</h2>
                    <p style="font-size: 1.2rem; margin-bottom: 20px;">Doğru Sayın: <span style="color: var(--correct); font-weight: bold; font-size: 1.5rem;">${correctScore}</span></p>
                    <p style="font-size: 1.2rem; margin-bottom: 30px;">Yanlış Sayın: <span style="color: var(--wrong); font-weight: bold; font-size: 1.5rem;">${wrongScore}</span></p>
                    <button class="action-btn" onclick="location.reload()" style="background: var(--neon-blue); color: black; border: none; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1.1rem; width: 100%;">ANA MENÜYE DÖN</button>
                </div>
            `;
            document.getElementById('scoreboard').style.display = 'none';
        }
    </script>
</body>
</html>
