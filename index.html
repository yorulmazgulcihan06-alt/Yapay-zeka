<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematik Arenası | 6. Sınıf</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.8);
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --correct: #00ff88;
            --wrong: #ff3366;
            --text-main: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(255, 0, 234, 0.1) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Üst Skor Paneli */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            font-weight: 800;
            font-size: 1.2rem;
        }

        .score-box { color: var(--neon-blue); }
        .score-correct { color: var(--correct); }
        .score-wrong { color: var(--wrong); }

        /* Ana İçerik */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Başlangıç Ekranı */
        .start-screen {
            text-align: center;
            animation: zoomIn 0.5s ease-out;
        }
        
        .start-screen h1 {
            font-size: 3rem;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .start-screen p {
            margin-bottom: 30px;
            color: #aaa;
            font-size: 1.1rem;
        }

        .start-btn {
            background: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .start-btn:hover {
            background: var(--neon-blue);
            color: var(--bg-dark);
            box-shadow: 0 0 30px var(--neon-blue);
            transform: scale(1.05);
        }

        /* Sınav Ekranı */
        .quiz-screen {
            width: 100%;
            display: none;
        }

        .question-card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            animation: slideInRight 0.4s ease-out;
        }

        .question-text {
            font-size: 1.4rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-container { grid-template-columns: 1fr; }
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #666;
        }

        .option-btn.correct {
            background: rgba(0, 255, 136, 0.2);
            border-color: var(--correct);
            color: var(--correct);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        .option-btn.wrong {
            background: rgba(255, 51, 102, 0.2);
            border-color: var(--wrong);
            color: var(--wrong);
            animation: shake 0.4s;
        }

        /* Animasyonlar */
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes slideInRight {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

    </style>
</head>
<body>

    <!-- Skor Tablosu -->
    <div class="scoreboard">
        <div class="score-box">SORU: <span id="question-counter">1/5</span></div>
        <div class="score-correct">DOĞRU: <span id="score-correct">0</span></div>
        <div class="score-wrong">YANLIŞ: <span id="score-wrong">0</span></div>
    </div>

    <div class="main-container">
        
        <!-- Başlangıç Ekranı -->
        <div class="start-screen" id="start-screen">
            <h1>Matematik Arenası</h1>
            <p>6. Sınıf konularından oluşan 5 soruluk meydan okuma. Hazır mısın?</p>
            <button class="start-btn" onclick="startQuiz()">OYUNA BAŞLA</button>
        </div>

        <!-- Sınav Ekranı -->
        <div class="quiz-screen" id="quiz-screen">
            <div class="question-card" id="question-card">
                <div class="question-text" id="question-text">Soru yükleniyor...</div>
                <div class="options-container" id="options-container">
                    <!-- Seçenekler buraya gelecek -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- SES MOTORU (Dışarıdan dosya indirmeden ses üretir) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'click') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        // --- SORU BANKASI (Senin kitabındaki konulardan harmanlandı) ---
        const questions = [
            {
                question: "Bir zar havaya atılıyor. Üst yüze gelen sayının çift olma olasılığı (deneysel değil, teorik) kaçtır?",
                options: ["1/2", "1/3", "1/6", "2/3"],
                correct: 0 // 1/2 (2, 4, 6 çift -> 3/6 = 1/2)
            },
            {
                question: "Bir torbada 3 kırmızı, 4 mavi, 5 yeşil top vardır. Torbadan rastgele çekilen bir topun MAVİ olma olasılığı kaçtır?",
                options: ["3/12", "4/12", "5/12", "3/4"],
                correct: 1 // 4/12 (Toplam 12 top, 4'ü mavi)
            },
            {
                question: "12 sayısının asal çarpanları aşağıdakilerden hangisidir?",
                options: ["1, 2, 3, 4, 6, 12", "2 ve 3", "2, 3 ve 4", "Sadece 2"],
                correct: 1 // Asal çarpanlar 2 ve 3'tür.
            },
            {
                question: "3/5 kesrinin ondalık gösterimi aşağıdakilerden hangisidir?",
                options: ["0,35", "0,6", "0,53", "1,66"],
                correct: 1 // 3 bölü 5 = 0,6
            },
            {
                question: "1 hektometre (hm) kaç metredir?",
                options: ["10 m", "100 m", "1000 m", "0,1 m"],
                correct: 1 // 1 hm = 100 m
            }
        ];

        let currentQuestion = 0;
        let correctScore = 0;
        let wrongScore = 0;
        let canAnswer = true;

        // --- OYUNU BAŞLAT ---
        function startQuiz() {
            playSound('click');
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            currentQuestion = 0;
            correctScore = 0;
            wrongScore = 0;
            updateScoreboard();
            showQuestion();
        }

        // --- SORUYU GÖSTER ---
        function showQuestion() {
            canAnswer = true;
            const q = questions[currentQuestion];
            
            // Soru metnini güncelle
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('question-counter').innerText = `${currentQuestion + 1}/${questions.length}`;

            // Seçenekleri oluştur
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; // Temizle

            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${String.fromCharCode(65 + index)}) ${option}`; // A, B, C, D şıkları
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        // --- CEVABI KONTROL ET ---
        function checkAnswer(selectedIndex, btnElement) {
            if (!canAnswer) return; // Zaten cevap verildiyse tekrar tıklamayı engelle
            canAnswer = false;

            const correctIndex = questions[currentQuestion].correct;
            const allButtons = document.querySelectorAll('.option-btn');

            if (selectedIndex === correctIndex) {
                // DOĞRU CEVAP
                playSound('correct');
                btnElement.classList.add('correct');
                correctScore++;
            } else {
                // YANLIŞ CEVAP
                playSound('wrong');
                btnElement.classList.add('wrong');
                // Doğru cevabı göster
                allButtons[correctIndex].classList.add('correct');
                wrongScore++;
            }

            updateScoreboard();

            // 1.5 saniye sonra sonraki soruya geç veya bitir
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    showQuestion();
                } else {
                    endQuiz();
                }
            }, 1500);
        }

        // --- SKORU GÜNCELLE ---
        function updateScoreboard() {
            document.getElementById('score-correct').innerText = correctScore;
            document.getElementById('score-wrong').innerText = wrongScore;
        }

        // --- OYUNU BİTİR ---
        function endQuiz() {
            const quizScreen = document.getElementById('quiz-screen');
            quizScreen.innerHTML = `
                <div class="question-card" style="text-align: center;">
                    <h2 style="color: var(--neon-blue); font-size: 2rem; margin-bottom: 20px;">Oyun Bitti!</h2>
                    <p style="font-size: 1.2rem; margin-bottom: 20px;">Toplam Doğru: <span style="color: var(--correct); font-weight: bold;">${correctScore}</span></p>
                    <p style="font-size: 1.2rem; margin-bottom: 30px;">Toplam Yanlış: <span style="color: var(--wrong); font-weight: bold;">${wrongScore}</span></p>
                    <button class="start-btn" onclick="location.reload()">TEKRAR OYNA</button>
                </div>
            `;
        }
    </script>
</body>
</html>
